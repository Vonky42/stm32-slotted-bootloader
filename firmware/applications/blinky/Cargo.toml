[package]
name = "blinky"
version = "0.1.0"
edition = "2024"

[build-dependencies]
boot-layout = { workspace = true, features = ["build"] }

[dependencies]
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f411"] }
cortex-m   = "0.7.10"
cortex-m-rt   = "0.7.7"
panic-halt   = "1.0.0"
boot-layout = { workspace = true }

[[bin]]
name = "blinky"

[profile.release]
opt-level = "s"
lto = true
debug = true