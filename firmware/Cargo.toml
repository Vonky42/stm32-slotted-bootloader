[package]
name = "stm32-slotted-bootloader"
version = "0.1.0"
edition = "2024"

[features]
default = ["defmt"]
defmt = ["dep:defmt", "dep:defmt-rtt", "dep:panic-probe", "boot-layout/defmt"]
no_defmt = ["dep:panic-halt"]

[dependencies]
boot-layout = { workspace = true }
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
# defmt = { version = "1", optional = true, }
defmt = { workspace = true, optional = true }
defmt-rtt = { version = "1", optional = true }
panic-halt = { version   = "1.0.0", optional = true }
panic-probe = { version = "1", features = ["print-defmt"], optional = true }
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f411"] }

[build-dependencies]
boot-layout = { workspace = true, features = ["build"] }

[workspace]
resolver = "2"
members = ["applications/*", "crates/boot-layout"]

[workspace.dependencies]
boot-layout = { path = "crates/boot-layout" }
defmt = "1"

[profile.release]
opt-level = "s"
debug = true
lto = true
