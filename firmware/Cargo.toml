[workspace]
resolver        = "2"
members         = ["bootloader", "applications/*", "crates/*"]
default-members = ["bootloader"]

[workspace.package]
version         = "0.1.0"
edition         = "2024"

[workspace.dependencies]
boot-core       = { path = "crates/boot-core" }
boot-backend    = { path = "crates/boot-backend" }
boot-frontend   = { path = "crates/boot-frontend" }

defmt           = "1"
cortex-m        = "0.7.10"
cortex-m-rt     = "0.7.7"
defmt-rtt       = "1"
panic-probe     = { version = "1", features = ["print-defmt"] }
stm32f4xx-hal   = { version = "0.23.0", features = ["stm32f411"] }
crc             = "3"
embedded-hal    = "1.0"

[profile.release]
opt-level       = "s"
debug           = true
lto             = true